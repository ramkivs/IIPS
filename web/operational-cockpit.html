<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IIPS Operational Cockpit MVP</title>
  <style>
    :root { --iips-color-background-page:#f5f7fa; --iips-color-background-panel:#ffffff; --iips-color-border-default:#d9dee7; --iips-color-text-primary:#1f2937; --iips-color-text-secondary:#6b7280; --iips-color-status-high:#b42318; --iips-color-status-medium:#b7791f; --iips-color-status-good:#1f7a4d; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--iips-color-background-page); color:var(--iips-color-text-primary); }
    .iips-cockpit { display:grid; grid-template-columns:220px 1fr 320px; grid-template-rows:64px 1fr; gap:16px; padding:16px; min-height:100vh; }
    .iips-cockpit__topbar,.iips-cockpit__nav,.iips-cockpit__main,.iips-cockpit__drawer,.iips-cockpit__governance { background:#fff; border:1px solid var(--iips-color-border-default); border-radius:14px; padding:16px; box-shadow:0 8px 24px rgba(20,33,61,.08); }
    .iips-cockpit__topbar { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; }
    .iips-cockpit__nav { grid-column:1; grid-row:2; }
    .iips-cockpit__main { grid-column:2; grid-row:2; display:grid; gap:16px; }
    .iips-cockpit__drawer { grid-column:3; grid-row:2; }
    .iips-cockpit__governance { grid-column:3; grid-row:2; align-self:end; margin-top:280px; }
    .metric-group { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .metric-card { background:#f9fafc; border:1px solid #e7ebf2; border-radius:12px; padding:12px; }
    .metric-card span { display:block; color:var(--iips-color-text-secondary); font-size:12px; text-transform:uppercase; font-weight:700; }
    .metric-card strong { display:block; margin-top:6px; font-size:22px; }
    table { width:100%; border-collapse:collapse; }
    td { border-bottom:1px solid #e7ebf2; padding:10px; }
    tr:first-child td { color:var(--iips-color-status-high); font-weight:800; }
  </style>
</head>
<body>
  <div id="root">Loading cockpit...</div>
  <script type="module">
    import { createOperationalCockpitView, renderOperationalCockpitToHtml } from './src/operational-cockpit/index.js';
    const view = createOperationalCockpitView();
    document.getElementById('root').innerHTML = renderOperationalCockpitToHtml(view);
  </script>
</body>
</html>
